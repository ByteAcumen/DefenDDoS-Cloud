# ===================================
# DefenDDoS - Complete Docker Compose
# All services including ML, Blockchain, Monitoring
# ===================================

version: '3.8'

services:
  # ==================== CORE SERVICES ====================
  
  # Backend Service (Spring Boot)
  backend:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: defenddos-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ML_SERVICE_URL=http://ml-service:8000
      - IPFS_HOST=ipfs
      - IPFS_PORT=5001
      - BLOCKCHAIN_ENABLED=true
      - BLOCKCHAIN_NETWORK_URL=https://rpc-mumbai.maticvigil.com
    depends_on:
      - influxdb
      - redis
      - kafka
      - ipfs
      - ml-service
    networks:
      - defenddos-network
    volumes:
      - ./backend-service/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ML Service (FastAPI + AI Models)
  ml-service:
    build:
      context: ./backend-service/ml-service
      dockerfile: Dockerfile
    container_name: defenddos-ml
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models
      - WORKERS=4
    networks:
      - defenddos-network
    volumes:
      - ./backend-service/ml-service/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./defenddos-frontend
      dockerfile: Dockerfile
    container_name: defenddos-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - NEXT_PUBLIC_WS_URL=ws://localhost:8081/ws
    depends_on:
      - backend
    networks:
      - defenddos-network
    restart: unless-stopped

  # ==================== DATA STORES ====================

  # InfluxDB (Time-Series Database)
  influxdb:
    image: influxdb:2.7-alpine
    container_name: defenddos-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=SecurePassword123
      - DOCKER_INFLUXDB_INIT_ORG=defenddos-org
      - DOCKER_INFLUXDB_INIT_BUCKET=ddos-bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    networks:
      - defenddos-network
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped

  # Redis (Cache & Session Store)
  redis:
    image: redis:7-alpine
    container_name: defenddos-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - defenddos-network
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==================== BLOCKCHAIN & IPFS ====================

  # IPFS (Distributed Storage)
  ipfs:
    image: ipfs/kubo:latest
    container_name: defenddos-ipfs
    ports:
      - "4001:4001" # P2P
      - "5001:5001" # API
      - "8080:8080" # Gateway
    environment:
      - IPFS_PROFILE=server
    networks:
      - defenddos-network
    volumes:
      - ipfs-data:/data/ipfs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MESSAGE QUEUE ====================

  # Zookeeper (Kafka Dependency)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: defenddos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - defenddos-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    restart: unless-stopped

  # Kafka (Event Streaming)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: defenddos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - defenddos-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MONITORING ====================

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: defenddos-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - defenddos-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: defenddos-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    networks:
      - defenddos-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

  # ==================== NGINX (Reverse Proxy) ====================

  nginx:
    image: nginx:alpine
    container_name: defenddos-nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - defenddos-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

# ==================== NETWORKS ====================

networks:
  defenddos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==================== VOLUMES ====================

volumes:
  influxdb-data:
  influxdb-config:
  redis-data:
  ipfs-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  prometheus-data:
  grafana-data:
