name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'backend-service/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'backend-service/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx512m'

jobs:
  # Job 1: Code Quality & Security Checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-service

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'backend-service/pom.xml'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Maven Verify (Compile + Tests)
      run: |
        chmod +x mvnw
        ./mvnw clean verify -B

    - name: Check Code Coverage
      run: |
        ./mvnw jacoco:report
        echo "Code coverage report generated"

    - name: Upload Coverage to Codecov (Optional)
      if: github.event_name == 'push'
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        files: ./backend-service/target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage

    - name: Dependency Security Check
      run: |
        ./mvnw dependency-check:check -B || echo "Security check completed with warnings"
      continue-on-error: true

  # Job 2: Build and Package
  build:
    name: Build Application
    needs: code-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-service

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'backend-service/pom.xml'

    - name: Build JAR Package
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests -B

    - name: List Build Artifacts
      run: ls -lh target/*.jar

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar-${{ github.sha }}
        path: backend-service/target/*.jar
        retention-days: 7
        if-no-files-found: error

  # Job 3: Docker Build & Push
  docker:
    name: Docker Build & Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-jar-${{ github.sha }}
        path: backend-service/target

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/defenddos-backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-service
        file: ./backend-service/Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Run Trivy Security Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository }}/defenddos-backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    - name: Upload Trivy Results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # Job 4: Integration Tests
  integration-test:
    name: Integration Tests
    needs: docker
    runs-on: ubuntu-latest
    services:
      influxdb:
        image: influxdb:2.7
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: password123
          DOCKER_INFLUXDB_INIT_ORG: test-org
          DOCKER_INFLUXDB_INIT_BUCKET: test-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: test-token
        ports:
          - 8086:8086
        options: >-
          --health-cmd "curl -f http://localhost:8086/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-jar-${{ github.sha }}
        path: backend-service/target

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Run Integration Tests
      working-directory: ./backend-service
      env:
        DEFENDDOS_INFLUXDB_URL: http://localhost:8086
        DEFENDDOS_INFLUXDB_TOKEN: test-token
        DEFENDDOS_INFLUXDB_ORG: test-org
        DEFENDDOS_INFLUXDB_BUCKET: test-bucket
        SPRING_DATA_REDIS_HOST: localhost
        SPRING_DATA_REDIS_PORT: 6379
      run: |
        chmod +x mvnw
        ./mvnw verify -Pintegration-tests -DskipUnitTests=true || echo "Integration tests completed"
      continue-on-error: true

  # Job 5: Performance & Load Testing
  performance-test:
    name: K6 Load Tests
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Start Services with Docker Compose
      working-directory: ./backend-service
      run: |
        docker-compose up -d
        sleep 60  # Wait for services to be ready

    - name: Install K6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run Smoke Test
      run: |
        cd tests
        k6 run --duration 30s --vus 5 k6-smoke-test.js || echo "Smoke test completed"
      continue-on-error: true

    - name: Check Backend Logs
      if: always()
      working-directory: ./backend-service
      run: docker-compose logs backend-service

    - name: Cleanup
      if: always()
      working-directory: ./backend-service
      run: docker-compose down -v

  # Job 6: Deployment (Production)
  deploy:
    name: Deploy to Production
    needs: [integration-test, performance-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://defenddos.yourdomain.com

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Server (Placeholder)
      run: |
        echo "Deployment would happen here"
        echo "Options: SSH to server, Kubernetes, Docker Swarm, Cloud Run, etc."
        echo "Image: ghcr.io/${{ github.repository }}/defenddos-backend:latest"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

  # Job 7: Notify Results
  notify:
    name: Notify Build Status
    needs: [code-quality, build, docker, integration-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Send Success Notification
      if: ${{ success() }}
      run: |
        echo "✅ CI/CD Pipeline completed successfully!"
        echo "All checks passed, artifacts created, Docker image built"

    - name: Send Failure Notification
      if: ${{ failure() }}
      run: |
        echo "❌ CI/CD Pipeline failed!"
        echo "Check the logs for details"
