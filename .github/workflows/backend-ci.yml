name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend-service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend-service/**'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend-service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: 'maven'
        cache-dependency-path: 'backend-service/pom.xml'

    - name: Run Tests
      run: |
        chmod +x mvnw
        ./mvnw test

    - name: Build JAR
      run: |
        chmod +x mvnw
        ./mvnw package -DskipTests

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend-service/target/*.jar
        retention-days: 1

  docker-build:
    needs: test-and-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-service
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: backend-service/target

    - name: Simple Docker Build Check
      run: docker build . --file Dockerfile --tag defenddos-backend:test
