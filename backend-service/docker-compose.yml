version: '3.8'

services:
  # InfluxDB Time-Series Database
  influxdb:
    image: influxdb:2.7
    container_name: defenddos-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=SecureInfluxPassword123
      - DOCKER_INFLUXDB_INIT_ORG=defenddos-org
      - DOCKER_INFLUXDB_INIT_BUCKET=ddos-bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=7QotbzsDl1Mg2JVkh3WhBHxw9YHLDRZT4fd7thN9015P1xuhs0BCpvVktQ2YJrU0_7fI3JP4yjIav5mrNYkSpg==
    networks:
      - defenddos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Caching and Rate Limiting
  redis:
    image: redis:7.2-alpine
    container_name: defenddos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass SecureRedisPassword123
    volumes:
      - redis-data:/data
    networks:
      - defenddos-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "SecureRedisPassword123", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DefenDDoS Backend Service
  backend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defenddos-backend
    restart: unless-stopped
    privileged: true  # Required for iptables IP blocking
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - "8082:8081"
    environment:
      - DEFENDDOS_INFLUXDB_URL=http://influxdb:8086
      - DEFENDDOS_INFLUXDB_TOKEN=7QotbzsDl1Mg2JVkh3WhBHxw9YHLDRZT4fd7thN9015P1xuhs0BCpvVktQ2YJrU0_7fI3JP4yjIav5mrNYkSpg==
      - DEFENDDOS_INFLUXDB_ORG=defenddos-org
      - DEFENDDOS_INFLUXDB_BUCKET=ddos-bucket
      - DEFENDDOS_DETECTION_THRESHOLD=100
      - DEFENDDOS_DETECTION_WINDOW=60000
      - DEFENDDOS_RATE_LIMIT_REQUESTS_PER_MINUTE=100
      - SPRING_PROFILES_ACTIVE=prod
      - DEFENDDOS_ALERTS_MAIL_ENABLED=false
      - SPRING_SECURITY_USER_NAME=admin
      - SPRING_SECURITY_USER_PASSWORD=DefenDDoS123!
      - DEFENDDOS_ML_SERVICE_ENABLED=true
      - DEFENDDOS_ML_SERVICE_URL=http://ml-service:8000
      - DEFENDDOS_ML_SERVICE_TIMEOUT_SECONDS=10
      - DEFENDDOS_ML_SERVICE_RETRY_ATTEMPTS=3
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=SecureRedisPassword123
    depends_on:
      influxdb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - defenddos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs

  # ML Detection Service (Python FastAPI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: defenddos-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - defenddos-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./ml-service/models:/app/models

  # Apache Kafka for event streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: defenddos-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - defenddos-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: defenddos-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    depends_on:
      - zookeeper
    networks:
      - defenddos-network

networks:
  defenddos-network:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  redis-data: