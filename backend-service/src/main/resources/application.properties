# DefenDDoS Backend Service - Base Configuration
spring.application.name=defenddos-backend-service

# Server Configuration
server.port=8081

# InfluxDB Configuration - USE ENVIRONMENT VARIABLES
defenddos.influx-db.url=${INFLUXDB_URL:http://localhost:8086}
defenddos.influx-db.token=${INFLUXDB_TOKEN}
defenddos.influx-db.org=${INFLUXDB_ORG:defenddos-org}
defenddos.influx-db.bucket=${INFLUXDB_BUCKET:ddos-bucket}

# Detection Configuration
defenddos.detection.enabled=true
defenddos.detection.packet-threshold=1000
defenddos.detection.time-window=-5m

# Mitigation Configuration
defenddos.mitigation.enabled=${MITIGATION_ENABLED:true}
defenddos.mitigation.dry-run=${MITIGATION_DRY_RUN:true}
defenddos.mitigation.auto-block=true
defenddos.mitigation.max-blocked-ips=${MITIGATION_MAX_BLOCKED_IPS:100}
defenddos.mitigation.auto-unblock-hours=24

# Alert Configuration
defenddos.alerts.enabled=false
defenddos.alerts.email.enabled=false
defenddos.alerts.email.to=admin@defenddos.com
defenddos.alerts.email.from=defenddos@noreply.com
defenddos.alerts.email.subject=DefenDDoS Alert

# ML Service Configuration
defenddos.ml-service.enabled=false
defenddos.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
defenddos.ml-service.timeout-seconds=10
defenddos.ml-service.retry-attempts=3

# Management Endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# Security - USE ENVIRONMENT VARIABLES
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# Mail Configuration (Basic - Override in profiles)
spring.mail.host=localhost
spring.mail.port=25

# ===== ADVANCED FEATURES CONFIGURATION =====

# Blockchain Threat Intelligence
blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
blockchain.network=polygon-mumbai
blockchain.network.url=${BLOCKCHAIN_NETWORK_URL:https://rpc-mumbai.maticvigil.com}
blockchain.wallet.address=${BLOCKCHAIN_WALLET_ADDRESS:}
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
blockchain.gas.limit=3000000

# IPFS Configuration
ipfs.enabled=true
ipfs.host=localhost
ipfs.port=5001
ipfs.protocol=http

# GeoIP Configuration
geoip.enabled=true
geoip.database.path=/usr/share/GeoIP/GeoLite2-City.mmdb
geoip.auto-update=true

# Redis Configuration (Distributed IP Blocking)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}

# DefenDDoS Redis Settings
defenddos.redis.host=${REDIS_HOST:localhost}
defenddos.redis.port=${REDIS_PORT:6379}
defenddos.redis.password=${REDIS_PASSWORD:}
defenddos.redis.database=${REDIS_DATABASE:0}
defenddos.redis.ttl-hours=${REDIS_BLOCKLIST_TTL_HOURS:24}
defenddos.redis.local-cache-seconds=${REDIS_LOCAL_CACHE_SECONDS:60}
spring.redis.database=0
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=600s

# Kafka Configuration (for Incident Response)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=defenddos-consumer
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.incidents=security-incidents

# Incident Response Configuration
incident.email.enabled=false
incident.email.to=security@defenddos.com
incident.email.from=defenddos-alerts@noreply.com
incident.slack.enabled=false
incident.slack.webhook=${INCIDENT_SLACK_WEBHOOK:}
incident.pagerduty.enabled=false
incident.pagerduty.key=${INCIDENT_PAGERDUTY_KEY:}
incident.kafka.topic=security-incidents

# Predictive Forecasting Configuration
forecasting.enabled=true
forecasting.schedule.cron=0 */5 * * * *
forecasting.historical.minutes=180
forecasting.attack.threshold=0.75
forecasting.confidence.minimum=0.6

# Advanced Fingerprinting Configuration
fingerprinting.enabled=true
fingerprinting.cache.size=10000
fingerprinting.cache.ttl=3600
fingerprinting.bot-network.threshold=5

# Real-Time Visualization Configuration
websocket.enabled=true
websocket.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
websocket.metrics.interval=1000
websocket.threats.interval=5000
websocket.performance.interval=2000

# Resilience Configuration
resilience4j.circuitbreaker.instances.mlService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.mlService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mlService.waitDurationInOpenState=30s
resilience4j.retry.instances.mlService.maxAttempts=3
resilience4j.retry.instances.mlService.waitDuration=2s