# Test Profile Configuration
spring.application.name=backend-service-test

# Server Configuration
server.port=0

# InfluxDB Test Configuration (In-Memory or Test Container)
influxdb.url=http://localhost:8086
influxdb.token=test-token
influxdb.org=defenddos-test-org
influxdb.bucket=defenddos-test-bucket

# ML Service Test Configuration
ml.service.url=http://localhost:8001
ml.service.timeout=5000

# Security Test Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
ADMIN_PASSWORD=admin123
ADMIN_USERNAME=admin
INFLUXDB_TOKEN=test-token
MITIGATION_ENABLED=true
MITIGATION_DRY_RUN=true


# Rate Limiting (Relaxed for testing)
rate.limit.capacity=100
rate.limit.tokens=100

# Logging
logging.level.root=INFO
logging.level.com.defenddos=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Test Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
