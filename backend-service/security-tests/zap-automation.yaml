# OWASP ZAP Automation Configuration
# This file configures automated security testing with OWASP ZAP

env:
  contexts:
    - name: "DefenDDoS-API"
      urls:
        - "http://localhost:8080"
      includePaths:
        - "http://localhost:8080/api/.*"
      excludePaths:
        - "http://localhost:8080/api/auth/logout"
      authentication:
        method: "http"
        parameters:
          hostname: "localhost"
          port: 8080
          realm: ""
        verification:
          method: "response"
          pollFrequency: 60
          pollUnits: "requests"

  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

  vars:
    api_base: "http://localhost:8080/api"
    auth_token: "${AUTH_TOKEN}"

jobs:
  - type: "passiveScan-config"
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
      maxBodySizeInBytesToScan: 10000

  - type: "spider"
    parameters:
      context: "DefenDDoS-API"
      url: "http://localhost:8080"
      maxDuration: 10
      maxDepth: 5
      maxChildren: 10

  - type: "spiderAjax"
    parameters:
      context: "DefenDDoS-API"
      url: "http://localhost:8080"
      maxDuration: 5
      maxCrawlDepth: 3
      browserName: "chrome-headless"

  - type: "passiveScan-wait"
    parameters:
      maxDuration: 5

  - type: "activeScan"
    parameters:
      context: "DefenDDoS-API"
      policy: "API-scan"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 30
    policyDefinition:
      rules:
        - id: 40012 # SQL Injection
          threshold: "medium"
        - id: 40014 # Cross Site Scripting (Reflected)
          threshold: "medium"
        - id: 40016 # Cross Site Scripting (Persistent)
          threshold: "medium"
        - id: 40018 # SQL Injection - MySQL
          threshold: "medium"
        - id: 90019 # Server Side Code Injection
          threshold: "medium"
        - id: 90020 # Remote OS Command Injection
          threshold: "medium"
        - id: 90021 # XPath Injection
          threshold: "medium"
        - id: 90022 # Application Error Disclosure
          threshold: "medium"
        - id: 90023 # XML External Entity Attack
          threshold: "medium"
        - id: 90024 # Generic Padding Oracle
          threshold: "medium"
        - id: 90025 # Expression Language Injection
          threshold: "medium"
        - id: 90026 # CRLF Injection
          threshold: "medium"
        - id: 90027 # Cookie Slack Detector
          threshold: "medium"
        - id: 90028 # Insecure HTTP Method
          threshold: "medium"
        - id: 90029 # HTTPS Content Available via HTTP
          threshold: "medium"
        - id: 90030 # Heartbleed OpenSSL Vulnerability
          threshold: "medium"

  - type: "report"
    parameters:
      template: "traditional-html"
      reportDir: "./security-tests/reports"
      reportFile: "zap-security-report"
      reportTitle: "DefenDDoS Security Test Report"
      reportDescription: "Automated security testing results for DefenDDoS API"

  - type: "report"
    parameters:
      template: "traditional-json"
      reportDir: "./security-tests/reports"
      reportFile: "zap-security-report"
