# ===================================
# DefenDDoS - Kubernetes Deployment
# Production-grade with auto-scaling
# ===================================

apiVersion: v1
kind: Namespace
metadata:
  name: defenddos
  labels:
    name: defenddos
    environment: production

---
# ConfigMap for Backend Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: defenddos-config
  namespace: defenddos
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  INFLUXDB_URL: "http://influxdb-service:8086"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  ML_SERVICE_URL: "http://ml-service:8000"
  IPFS_HOST: "ipfs-service"
  IPFS_PORT: "5001"
  FORECASTING_ENABLED: "true"
  BLOCKCHAIN_ENABLED: "true"
  WEBSOCKET_ENABLED: "true"

---
# Secret for Sensitive Data
apiVersion: v1
kind: Secret
metadata:
  name: defenddos-secrets
  namespace: defenddos
type: Opaque
stringData:
  INFLUXDB_TOKEN: "my-super-secret-token"
  BLOCKCHAIN_PRIVATE_KEY: "REPLACE_WITH_YOUR_KEY"
  SLACK_WEBHOOK: "REPLACE_WITH_YOUR_WEBHOOK"
  PAGERDUTY_KEY: "REPLACE_WITH_YOUR_KEY"

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenddos-backend
  namespace: defenddos
  labels:
    app: defenddos-backend
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: defenddos-backend
  template:
    metadata:
      labels:
        app: defenddos-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: defenddos/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: defenddos-config
        - secretRef:
            name: defenddos-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: defenddos
  labels:
    app: defenddos-backend
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: defenddos-backend

---
# Backend HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: defenddos-backend-hpa
  namespace: defenddos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: defenddos-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30

---
# ML Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: defenddos
  labels:
    app: ml-service
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        tier: ml
    spec:
      containers:
      - name: ml-service
        image: defenddos/ml-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: WORKERS
          value: "4"
        - name: MODEL_PATH
          value: "/app/models"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /app/models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ml-models-pvc

---
# ML Service
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: defenddos
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: ml-service

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenddos-frontend
  namespace: defenddos
  labels:
    app: defenddos-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: defenddos-frontend
  template:
    metadata:
      labels:
        app: defenddos-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: defenddos/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8081"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://backend-service:8081/ws"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: defenddos
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: defenddos-frontend

---
# Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: defenddos-ingress
  namespace: defenddos
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
spec:
  tls:
  - hosts:
    - defenddos.yourdomain.com
    secretName: defenddos-tls
  rules:
  - host: defenddos.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8081
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8081
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000

---
# PersistentVolumeClaim for ML Models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
  namespace: defenddos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: defenddos
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        args:
        - redis-server
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - allkeys-lru
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: defenddos
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
